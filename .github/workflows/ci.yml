name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `task secrets` scans the whole history

      # Same versions a dev machine uses, rather than pinning them twice.
      # One source of truth: the same script, pins and code a developer machine runs.
      - name: Install the gate tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./install.sh gate-tools
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Read the pinned Go version
        run: grep -E '^GO_VERSION=' install.sh | tr -d '"' >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The agentbar e2e suite drives real tmux servers on private sockets.
      - name: task check
        run: task check
