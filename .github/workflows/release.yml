name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff needs full history and tags

      # One source of truth: the same script, pins and code a developer machine runs.
      - name: Install the gate tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./install.sh gate-tools
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Read the pinned Go version
        run: grep -E '^GO_VERSION=' install.sh | tr -d '"' >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/agentbar/go.sum

      - name: task check
        run: task check

      # A release ships only if a clean container can bootstrap, twice.
      - name: Fresh-install test
        run: test/bootstrap-fresh.sh

      - name: Build the release notes for this tag
        run: git cliff --latest --strip header --output RELEASE_NOTES.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "dotfiles ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
