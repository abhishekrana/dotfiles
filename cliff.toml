# git-cliff config: turns Conventional Commits into CHANGELOG.md and the GitHub
# Release notes. Docs: https://git-cliff.org/docs/configuration
#
# Commits before the convention was adopted are unconventional and are filtered
# out, so v0.1.0's entry is hand-written and generation starts from v0.2.0.

[changelog]
header = """
# Changelog

Notable changes to these dotfiles, in [Keep a Changelog](https://keepachangelog.com/en/1.1.0/)
spirit and versioned with [SemVer](https://semver.org/).

This repo stays on **0.x** by choice. Pre-1.0 SemVer puts the breaking signal on
the MINOR, so a release needing manual steps on the machine - a re-login, a
re-stow, a GNOME shortcut, a systemd unit - bumps 0.x and says which.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**needs manual steps** - {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Drop anything that isn't a conventional commit rather than dumping it into a
# catch-all group - the pre-convention history would swamp the first release.
filter_unconventional = true
filter_commits = false
protect_breaking_commits = true
split_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
topo_order = false

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  # Release chores and CI plumbing are noise in a changelog.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", group = "Maintenance" },
  # Anything else parses as conventional only by accident ("CLAUDE.md: …",
  # "TODO: …" read as a type), so it is dropped rather than made into a group.
  { message = ".*", skip = true },
]
