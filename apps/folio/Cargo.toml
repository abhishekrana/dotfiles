[package]
name = "folio"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A markdown reader for the terminal that reads like a page"
license = "MIT"
publish = false

[[bin]]
name = "folio"
path = "src/main.rs"

# Every dependency is pinned to the exact latest stable release; bumps are their own commits.
[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive", "env"] }
comrak = { version = "=0.55.0", default-features = false }
crossterm = "=0.29.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
ropey = "=1.6.1"
serde = { version = "=1.0.229", features = ["derive"] }
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "=2.0.20"
toml = "=1.1.6"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-default-fancy"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[dev-dependencies]
insta = "=1.48.0"
unicode-width = "=0.2.2"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Casts between the u16 terminal geometry and usize indices are pervasive and checked at the edge.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Module-scoped docs are the repo's DESIGN.md and CLAUDE.md, not rustdoc.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Text attributes (bold, italic, underline, strike) are independent flags by nature.
struct_excessive_bools = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.insta]
opt-level = 3
