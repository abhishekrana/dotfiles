# =============================================================================
# General Settings
# =============================================================================

# Reduce escape delay to 0 (critical for Neovim -- default 500ms causes lag)
set -sg escape-time 0

# True color support (needed for Neovim themes, bat, delta, etc.)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Ghostty advertises truecolor via COLORTERM locally, but SSH doesn't forward
# COLORTERM and the override above doesn't match "xterm-ghostty" -- so declare
# RGB for it explicitly, otherwise colors degrade to 256 over SSH.
set -as terminal-features 'xterm-ghostty:RGB'

# Ghostty extended keys (proper modifier key support in Neovim, etc.)
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'

# OSC 8 hyperlink passthrough (clickable links in TUIs)
set -as terminal-features '*:hyperlinks'

# Mouse support (click panes, resize, scroll)
set -g mouse on
# Everything on the status bar acts on the RELEASE edge, not the press: the
# terminal intermittently drops the MouseDown of a status click (especially the
# first click after focus/idle) but always delivers the MouseUp -- so binding to
# the press makes clicks flaky. Guarded to each range so clicks on the GitLab
# segments in status-right don't switch windows.
bind -n SecondClick1Status if -F "#{==:window,#{mouse_status_range}}" "switch-client -t =" ""
bind -n TripleClick1Status if -F "#{==:window,#{mouse_status_range}}" "switch-client -t =" ""
# Press selects the window tab under the cursor (immediate feedback); the real,
# reliable action is on release below.
bind -n MouseDown1Status if -F "#{==:window,#{mouse_status_range}}" "select-window -t =" ""
# Release: "dictate" toggles recording, "workdesk" opens or closes the work float, "dictsend"
# toggles recording and presses Enter once the transcript lands, "push" types
# "commit and push" + Enter, "diff" opens the diff-pane menu, gl-* opens the
# GitLab link, otherwise switch tab.
# Trace every status click tmux actually received first (off the critical path
# via -b): a line present but no action = our bug; NO line = the terminal
# dropped the click (the known Ghostty+tmux status-click bug).
bind -n MouseUp1Status {
  run-shell -b "$HOME/.local/bin/dotfiles-trace log tmux click range='#{mouse_status_range}'"
  if -F "#{==:dictate,#{mouse_status_range}}" {
    run-shell -b "$HOME/.local/bin/dictate --toggle"
  } {
    if -F "#{==:settings,#{mouse_status_range}}" {
      # Centred dialogue, same idiom as the Alt-; session picker. Picking applies
      # immediately and the popup stays open, so a flavor can be tried.
      display-popup -E -w 46% -h 45% "$HOME/.local/bin/tmux-settings.sh"
    } {
    if -F "#{==:workdesk,#{mouse_status_range}}" {
      # The button IS the Alt-n key: one tmux-workdesk.sh, so they cannot drift.
      # Both open and close, because the float is a pane and a click on the chip
      # still reaches tmux while it is up.
      run-shell -b "$HOME/.local/bin/tmux-workdesk.sh"
    } {
    if -F "#{==:dictsend,#{mouse_status_range}}" {
      run-shell -b "$HOME/.local/bin/dictate --toggle --send"
    } {
      if -F "#{==:push,#{mouse_status_range}}" {
        run-shell -b "tmux set -g @push_flash 1; tmux refresh-client -S; $HOME/.local/bin/dictate --type 'commit and push'; sleep 0.15; tmux set -gu @push_flash; tmux refresh-client -S"
      } {
        if -F "#{==:diff,#{mouse_status_range}}" {
          # A click only opens the menu, never moves the pane: amber used to follow the
          # agent in one click, yanking the pane off a worktree you picked yourself. `f`
          # does that now. Title names the worktree on screen.
          # -O: keep the menu open after the opening MouseUp (we bind release, not
          # press, since Ghostty drops the MouseDown) -- else it self-closes the
          # instant the mouse leaves the status line. Click an item or press its key.
          display-menu -O -x M -y S -T "#{T:@diff_menu_title}" \
            "Working tree - watch" w "run-shell -b '$HOME/.local/bin/tmux-diff-pane.sh work'" \
            "Staged" s "run-shell -b '$HOME/.local/bin/tmux-diff-pane.sh staged'" \
            "Vs main" m "run-shell -b '$HOME/.local/bin/tmux-diff-pane.sh main'" \
            "Last commit" l "run-shell -b '$HOME/.local/bin/tmux-diff-pane.sh last'" \
            "" \
            "Follow agent#{?@agent_workdir,  → #{b:@agent_workdir},}" f \
              "run-shell -b '$HOME/.local/bin/tmux-diff-pane.sh follow'" \
            "Pick worktree..." W "run-shell -b '$HOME/.local/bin/tmux-diff-pane.sh pick'" \
            "Auto-follow  [ #{?#{==:#{@diff_follow},on},on,off} ]" F \
              "run-shell -b '$HOME/.local/bin/tmux-diff-pane.sh autofollow-toggle'" \
            "" \
            "Toggle split/stack" t "run-shell -b '$HOME/.local/bin/tmux-diff-pane.sh layout'" \
            "" \
            "Close diff pane" x "run-shell -b '$HOME/.local/bin/tmux-diff-pane.sh close'"
        } {
          if -F "#{m:gl-*,#{mouse_status_range}}" {
            run-shell -b "$HOME/.local/bin/tmux-gitlab.sh open #{mouse_status_range} '#{pane_current_path}'"
          } {
            if -F "#{==:window,#{mouse_status_range}}" "switch-client -t =" ""
          }
        }
      }
    }
    }
  }
  }
}

# Scrollback buffer (default is 2000 -- keep modest to limit RAM use)
set -g history-limit 10000

# Start window/pane numbering at 1 (0 is awkward to reach)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Auto-renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Don't let programs rename windows
set -g allow-rename off

# Enable focus events (needed for Neovim autoread)
set -g focus-events on

# vi mode for status line key bindings
set -g status-keys vi

# Allow image preview passthrough (for yazi + Kitty graphics protocol)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Clipboard -- one path for every copy trigger. tmux's own drag / double-click /
# triple-click / Enter bindings all call `copy-pipe-and-cancel` with no argument,
# which runs copy-command, so pointing it at tmux-yank.sh (clipboard + primary +
# trace) is what makes them behave identically. clip picks the backend.
set -g set-clipboard on
set -g copy-command '$HOME/.local/bin/tmux-yank.sh'

# Increase message display time
set -g display-time 2000
set -g display-panes-time 2000

# =============================================================================
# Prefix -- keep default Ctrl-b
# =============================================================================

# Using default Ctrl-b prefix (no change needed)

# =============================================================================
# Key Bindings
# =============================================================================

# Enter copy mode without prefix
bind -n M-y copy-mode

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Reset the UI (prefix + R): reload this config, refresh the session's sidebar so
# rebuilt code shows, put every window back to its default geometry (sidebar
# left, remaining columns even) and clear stuck status chips. Nothing is killed,
# so no work is lost. -b keeps the server serving while it walks the sessions.
bind R run-shell -b "$HOME/.local/bin/tmux-reset.sh '#{session_name}'"

# Splits -- visual mnemonics, preserve current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+number to switch windows without prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+j/k to cycle windows
bind -n M-j previous-window
bind -n M-k next-window

# Alt+m to cycle panes
bind -n M-m select-pane -t :.+

# Pane resizing (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Move window positions
bind -r P swap-window -t -1 \; select-window -t -1
bind -r N swap-window -t +1 \; select-window -t +1

# Toggle synchronized panes (type in all panes at once)
bind S set synchronize-panes \; display "Sync #{?synchronize-panes,ON,OFF}"

# Kill without confirmation prompt
unbind x
bind x kill-pane
bind X kill-session

# Even out pane sizes
bind = select-layout tiled

# Alt+h/l to switch sessions: up/down the agent bar's own order (pinned,
# active, dormant; alphabetical inside each), wrapping at both ends, so the
# keys walk the sidebar top to bottom instead of tmux's alphabetical session
# list -- which jumped over a pinned or dormant session's visible position.
# The fallback keeps the keys alive before apps/agentbar is built.
# The pressing client's session and tty are passed in, never guessed: tmux does
# not re-stamp TMUX_PANE for a binding's run-shell child (it inherits the
# server's environment), so a guess can start the walk on the wrong row or move
# another attached client.
bind -n M-h run-shell "$HOME/dotfiles/apps/agentbar/bin/agentbar prev '#{client_session}' '#{client_tty}' || tmux switch-client -p"
bind -n M-l run-shell "$HOME/dotfiles/apps/agentbar/bin/agentbar next '#{client_session}' '#{client_tty}' || tmux switch-client -n"

# Toggle between current and last-used session (Alt+')
bind -n "M-'" switch-client -l

# Session picker (Alt+;) -- same order and bands as the agent bar (from
# `agentbar order`), window-list preview, Claude state icons. Keys: j/k/g/G
# nav, p pin/unpin, r rename, D kill, c new session; Alt+; again to dismiss.
bind -n "M-;" display-popup -E -w 60% -h 85% "$HOME/.local/bin/tmux-session-picker.sh"

# workdesk (Alt+n) -- the GitLab work you own, banded by who owns the next move:
# inbox, merge requests, issues, and the agents that produced them. Keys: 1-4 and
# tab switch views, j/k nav, / filter, o browser, c worktree, ? every binding.
#
# Wider and taller than the session picker: this one has two panes, and a merge
# request sheet is the widest thing either of them shows.
#
# Invoked by absolute path, like the agentbar bindings above: apps/ binaries are not
# stow packages, so there is no ~/.local/bin symlink to rely on inside tmux.
#
# A float, not a popup, and the difference is the chip. A popup is an overlay: it
# swallows every click outside its own box, so a second click on ≡ workdesk never
# reached tmux and the chip could only open. A float is a pane, so the click lands and
# the chip closes what it opened. Probed both ways before the switch.
#
# The command is an option, not inline in the binding, because the chip opens the same
# float: two copies of the geometry are two things to keep in step. tmux-workdesk.sh is
# the one command behind both - it closes this window's float if one is up, else runs
# what this option says.
# -X/-Y are not optional: with no offset tmux cascades floats, stepping each new one 4
# columns right and 2 rows down from the last, so the second open is already off centre
# and the fifth is half off the screen. 5%/7% is the margin left by 90%/85%.
set -g @workdesk_open "new-pane -x 90% -y 85% -X 5% -Y 7% '$HOME/dotfiles/apps/agentbar/bin/workdesk open'"
bind -n M-n run-shell -b "$HOME/.local/bin/tmux-workdesk.sh"

# =============================================================================
# Copy Mode (vi-style)
# =============================================================================

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# =============================================================================
# Status Bar
# =============================================================================

set -g status-position bottom
set -g status-interval 5
# Solarized Light colors
# base03=#002b36 base02=#073642 base01=#586e75 base00=#657b83
# base0=#839496  base1=#93a1a1  base2=#eee8d5  base3=#fdf6e3
# yellow=#b58900 orange=#cb4b16 red=#dc322f green=#859900
# cyan=#2aa198   blue=#268bd2   violet=#6c71c4 magenta=#d33682

set -g status-style "fg=#657b83,bg=#eee8d5"

# Host badge -- distinguishes which machine this tmux server runs on.
# Resolved once at server start (SSH_CONNECTION is reliable there): "local", or
# the hostname when reached over SSH. TEXT ONLY - the colours belong to
# status-left, which the theme switcher rewrites; a pre-styled option cannot be
# repainted, which is how this badge stayed Solarized in every other flavor. The
# hostname is expanded by the shell here because #h does not re-expand inside a
# user option. The host glyph needs a Nerd Font.
run-shell 'if [ -n "$SSH_CONNECTION" ]; then \
  tmux set -g @host_name "  $(hostname -s) "; \
  tmux set -g @is_ssh 1; \
else \
  tmux set -g @host_name "  local "; \
  tmux set -g @is_ssh 0; \
fi'

# The session badge turns red while the prefix is pending, rather than inserting a
# " PREFIX " chip into status-right: an appearing chip shifted the whole git
# cluster sideways every time the prefix was pressed. Colour carries state here,
# width never changes - same rule as the diff chip and the window bell.
set -g status-left "#{?#{==:#{@is_ssh},1},#[fg=#fdf6e3 bg=#b58900 bold],#[fg=#fdf6e3 bg=#859900 bold]}#{@host_name}#{?client_prefix,#[fg=#fdf6e3 bg=#dc322f bold],#[fg=#fdf6e3 bg=#268bd2 bold]} #S #[fg=#657b83,bg=#eee8d5] "
set -g status-left-length 50
# dictation control moved to the centre (status-format[0] below).
# The footer describes THE PANE YOU CLICKED, like every rail does: its branch in
# full (the rails cap at 22 columns, this is where the whole name lives), its
# commit and its CI. No git-status plugin here - folder and branch are per-pane
# facts carried by the rails, which also takes ~72ms of git off every status
# redraw. The date is load-bearing for screenshots, so it never competes.
set -g status-right "#[fg=#859900]#($HOME/.local/bin/tmux-rail.sh --branch '#{pane_current_path}') #[fg=#cb4b16]#(cd #{pane_current_path} 2>/dev/null && git log -1 --abbrev=7 --format='%%h' 2>/dev/null)#($HOME/.local/bin/tmux-gitlab.sh render \"#{pane_current_path}\") #[fg=#657b83]%Y-%m-%d %H:%M:%S "
set -g status-right-length 200
set -g status-justify absolute-centre
set -g window-status-current-format "#[fg=#fdf6e3,bg=#b58900,bold] #I:#W#{?window_zoomed_flag, Z,} "
# window tabs: red on bell (agent idle), else grey
set -g window-status-format "#{?window_bell_flag,#[fg=#fdf6e3 bg=#dc322f bold],#[fg=#93a1a1 bg=#eee8d5]} #I:#W "

# ≡ workdesk button: a click opens the float Alt-n does, and closes it again. First in
# the row, ahead of the dictation chips: it is where the work is picked up, before
# anything is said about it. Muted like ● dictate - it has no state to report, and the
# chips that use colour to mean something should not compete with it. Labelled with the
# tool's name rather than its result, alone in this row, because it is the one thing
# here that is also a CLI you type.
#
# A list mark on the math axis, not a boxed one: a full-height glyph (▤, ▥, ▦) touches
# the top of its cell and reads as a second bar butting against the row above.
set -g @workdesk_seg "#[fg=#93a1a1 bg=#eee8d5] ≡ workdesk "

# dictate control: grey idle, red recording, amber transcribing (@dictate set by the dictate script)
# Five chips, one space of padding inside each and one between: every gap is the
# same three columns, so the row reads as a toolbar instead of a ragged sentence.
# Labels say what happens, not which key is pressed - there are no tooltips here.
set -g @dictate_seg "#{?#{&&:#{==:#{@dictate_src},dictate},#{==:#{@dictate},rec}},#[fg=#dc322f bg=#eee8d5] ● dictate ,#{?#{&&:#{==:#{@dictate_src},dictate},#{==:#{@dictate},work}},#[fg=#b58900 bg=#eee8d5] ● dictate ,#[fg=#93a1a1 bg=#eee8d5] ● dictate }}"
# Each dictate chip lights up ONLY when @dictate_src names it: colour is the only
# feedback a status bar has, so it has to say which button you hit, not merely
# that something is recording. Never key two chips off one state.
# dictate+send rests in teal, the row's one lit chip: it is used most, and grey
# reads as unavailable. Never warm - it would collide with this chip's own rec
# (red) and work (amber) states.
set -g @dictsend_seg "#{?#{&&:#{==:#{@dictate_src},dictsend},#{==:#{@dictate},rec}},#[fg=#dc322f bg=#eee8d5] ● dictate+send ,#{?#{&&:#{==:#{@dictate_src},dictsend},#{==:#{@dictate},work}},#[fg=#b58900 bg=#eee8d5] ● dictate+send ,#[fg=#2aa198 bg=#eee8d5] ● dictate+send }}"
# ⇡ commit+push button (types "commit and push" + Enter to the target pane); flashes green on click
set -g @push_seg "#{?@push_flash,#[fg=#fdf6e3 bg=#859900] ⇡ commit+push ,#[fg=#268bd2 bg=#eee8d5] ⇡ commit+push }"
# Is the diff pane showing a worktree no agent is touching? Colour only - it says
# "the agent is writing elsewhere", and never moves the pane on its own (the menu's
# f does that). Membership in @agent_workdirs, not equality with the latest - an
# agent alternating between two worktrees would otherwise flicker the chip on every
# file it writes.
set -g @diff_drift "#{&&:#{@diff_target},#{&&:#{@agent_workdirs},#{!=:#{m:*|#{@diff_target}|*,#{@agent_workdirs}},1}}}"

# ◧ changes button: click opens the diff-pane mode menu (tmux-diff-pane.sh) and nothing
# else - the pane moves only from a menu item. Label shows the current mode from
# @diff_mode. Violet matches the GitLab MR chip (secondary identity hue); amber
# means the agent is writing in another worktree - same width either way, so the
# status line never reflows (a wider chip clips the right-aligned segments).
set -g @diff_seg "#{?#{E:@diff_drift},#[fg=#b58900 bg=#eee8d5 bold],#[fg=#6c71c4 bg=#eee8d5]} ◧ changes "
# The menu title is an option, not inline in the binding, so the theme switcher
# can repaint it - a colour written into a key binding is unreachable.
set -g @diff_menu_title "#[align=centre,fg=#6c71c4]◧ diff pane#{?@diff_target, · #{b:@diff_target},}"

# Settings, far right so its fixed width never reflows the clock beside it. The
# trailing space keeps a two-cell click target and one column off the screen
# edge, where a chip is liable to be clipped.
set -g @settings_seg "#[fg=#93a1a1 bg=#eee8d5]⛭ "


# status bar: left = session + window tabs · dead-centre = ≡ workdesk + dictate + commit+push + ◧ changes · right = git/clock
set -g status-format[0] "#[align=left]#{T:status-left}#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange default],#[range=window|#{window_index}]#{T:window-status-current-format}#[norange default]}#[list=on align=#{status-justify}]#[range=user|workdesk]#{T:@workdesk_seg}#[norange default] #[range=user|dictate]#{T:@dictate_seg}#[norange default] #[range=user|dictsend]#{T:@dictsend_seg}#[norange default] #[range=user|push]#{T:@push_seg}#[norange default] #[range=user|diff]#{T:@diff_seg}#[norange default]#[nolist align=right]#{T:status-right}#[range=user|settings]#{T:@settings_seg}#[norange default]"

# Window/pane colors (solarized-light)
set -g window-style "fg=#657b83,bg=#fdf6e3"
set -g window-active-style "fg=#657b83,bg=#fdf6e3"

# Pane borders
set -g pane-border-style "fg=#93a1a1,bg=#fdf6e3"
set -g pane-active-border-style "fg=#268bd2,bg=#fdf6e3"

# Every pane carries a rail, and the rule is the same for all of them - shell,
# agent, diff viewer. The sidebar is the one exception: it draws its own header,
# and its rail only ever named whatever directory that process happened to start
# in. LEFT, always: this pane's folder and its branch
# (nothing at all when it is not a checkout). RIGHT, only when that pane is
# running Claude: the worktree it is writing in, which its cwd never follows.
# Two zones via #[align=right], so the left is anchored at one column forever and
# the right grows leftward into rule - no text ever shifts under you. Each zone
# is told the pane's width and how many zones share it, so the branch is cut
# only when the pane genuinely has no room for it. Both zones are the accent
# blue: in the foreground grey the rail read as one more line of the log
# scrolling beneath it.
# Costs one cached `git branch` per directory (~2ms, memoised for 3s and reused
# across panes and zones); tmux reruns a #() job at most once a second.
set -g @rail_agent "#{&&:#{||:#{==:#{pane_current_command},claude},#{==:#{pane_current_command},node}},#{@agent_workdir}}"
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{pane_current_command},agentbar},, #[fg=#268bd2]#($HOME/.local/bin/tmux-rail.sh '#{pane_current_path}' '#{pane_width}' '#{?#{E:@rail_agent},2,1}') #{?#{E:@rail_agent},#[align=right fg=#268bd2]→ #($HOME/.local/bin/tmux-rail.sh '#{@agent_workdir}' '#{pane_width}' 2) , }}"

# Theme overlay: the `theme` switcher regenerates these colors per flavor into
# ~/.config/theme/tmux.conf; source it so a fresh server picks up the last choice.
if-shell '[ -f ~/.config/theme/tmux.conf ]' 'source-file ~/.config/theme/tmux.conf'


# Activity monitoring (highlight windows with new output)
set -g monitor-activity on
set -g visual-activity off

# Bell notifications (useful for agent idle detection)
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# =============================================================================
# Plugins (via TPM)
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Plugin settings
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
# Relaunch on restore: agent sidebars (plugin adopts them) and Claude panes.
# The sidebar plugin's post-save hook rewrites each saved `claude` into
# `claude --resume <session-id>`, so a restore reopens the conversation, not a
# blank prompt. Leading ~ is resurrect's substring match (saved command is a
# full path), not $HOME.
set -g @resurrect-processes '"~agentbar run" "~claude"'

# tmux-yank must not bind MouseDragEnd1Pane: its own binding bypasses
# copy-command, which is the single path every other trigger uses.
set -g @yank_with_mouse off

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# agentbar (apps/): its .tmux entry builds the Go binary on demand;
# bootstrap.sh builds it up front. Runs after TPM so its status/resurrect wiring layers on last.
run-shell '~/dotfiles/apps/agentbar/agentbar.tmux'

# The sidebar's hook stamps @agent_workdir when an agent writes in a different
# worktree, then runs this. It is a no-op unless the agent's window turned
# auto-follow on (the ◧ diff menu's F), so nothing moves unasked.
run-shell 'tmux set -g @agentbar-workdir-cmd "$HOME/.local/bin/tmux-diff-pane.sh autofollow"'

# Every copy trigger, bound explicitly to the no-argument form so it runs
# copy-command. Stated here rather than left to tmux's defaults because plugins
# load before this and rebind the same keys; being explicit also means a plain
# `source-file` fully repairs a running server. No $HOME, so no run-shell needed.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel

# Route tmux-resurrect saves through a guard wrapper (must be after TPM, which
# points @resurrect-save-script-path at resurrect's own save.sh). The wrapper
# normalises empty / ":"-prefixed pane titles before each save: an empty
# #{pane_title} collapses a field in resurrect's tab-delimited state, which
# restores panes to the wrong cwd. Honored by both continuum's autosave and the
# systemd timer. run-shell is used so $HOME expands (keeps the path portable).
run-shell 'tmux set -g @resurrect-save-script-path "$HOME/.local/bin/tmux-resurrect-save-guarded.sh"'
# Manual save (prefix + C-s) through the same guard.
bind-key C-s run-shell "$HOME/.local/bin/tmux-resurrect-save-guarded.sh"
