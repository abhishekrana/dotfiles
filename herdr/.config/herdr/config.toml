# herdr configuration -- keybindings mirror tmux where possible.
# Run `herdr --default-config` to regenerate this template with the
# upstream defaults and comments.

# Skip the first-run onboarding overlay.
onboarding = false

# =============================================================================
# Theme -- solarized-light to match tmux/Ghostty
# =============================================================================

# Built-in themes: see https://herdr.dev/docs/configuration/
[theme]
name = "solarized-light"

# =============================================================================
# Keybindings -- prefix mode entered with Ctrl-b (same as tmux)
# =============================================================================

[keys]
prefix = "ctrl+b"

# Workspaces -- top-level project containers (no tmux analog, closest = session)
# `n` is reserved below for next_tab (mirrors tmux's default prefix+n).
new_workspace = "w"
rename_workspace = "shift+w"
close_workspace = "shift+x"   # mirrors tmux's `X` = kill-session
previous_workspace = "shift+h"
next_workspace = "shift+l"

# Tabs -- closest analog to tmux windows
new_tab = "c"                 # matches tmux new-window
rename_tab = ","
# Bound to plain `p`/`n` (also tmux's default prev/next window) so that a
# Ghostty `alt+j=text:\x02p` / `alt+k=text:\x02n` injection works in both
# multiplexers without breaking the tmux fallback.
previous_tab = "p"
next_tab = "n"
close_tab = ""                # unset; close last pane instead

# Panes -- direct tmux mapping
split_vertical = "|"          # split right (left|right) -- mirrors tmux `|`
split_horizontal = "-"        # split down (top/bottom)  -- mirrors tmux `-`
close_pane = "x"              # no confirm (matches tmux `bind x kill-pane`)
fullscreen = "z"              # tmux's zoom shortcut
rename_pane = "."

# Pane focus -- left unset. herdr 0.5.9 intercepts focus_pane_* bindings
# globally (not only after prefix), so ANY key bound here gets blocked
# inside panes (verified with both letters and arrow keys). Use the mouse
# or sidebar to focus panes instead.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# Misc
reload_config = "r"           # tmux: `bind r source-file ~/.tmux.conf`
resize_mode = "shift+r"       # default `r` is taken by reload above
toggle_sidebar = "b"
detach = "d"                  # matches tmux `prefix d`
open_notification_target = "o"

# Indexed jumps -- press prefix, then <modifier>+<digit> to jump directly.
[keys.indexed]
tabs = "alt"
workspaces = "ctrl+shift"
agents = "ctrl+alt"

# Custom prefix-mode commands.
[[keys.command]]
key = "g"
type = "pane"
command = "lazygit"

[[keys.command]]
key = "G"
type = "pane"
command = "lazydocker"

# =============================================================================
# UI
# =============================================================================

[ui]
sidebar_width = 28
mouse_capture = true           # tmux: `set -g mouse on`
confirm_close = false          # tmux: kill without prompt
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
agent_panel_scope = "all"
accent = "#268bd2"

# In-app toasts only -- desktop notifications are off in Ghostty.
[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

# =============================================================================
# Advanced
# =============================================================================

[advanced]
# ~10 MB per pane; herdr counts bytes, tmux counts lines (history-limit 10000).
scrollback_limit_bytes = 10000000

[experimental]
allow_nested = false
kitty_graphics = false
